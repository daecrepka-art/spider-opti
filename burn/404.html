<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#000000" />
<title>404 — BURN</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Cpath d='M16 5 C14 10 10 12 10 17 a6 6 0 0 0 12 0 c0-3-1-5-3-7-1 1-2 2-3 2 0-3 1-5 0-7z' fill='%23CC2200'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"DM Sans",system-ui,sans-serif;font-weight:300;color:#FFF;background:#000;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:6vw;overflow:hidden;position:relative}
.flame{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64vmin;height:64vmin;border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(204,34,0,0.55) 0%,rgba(204,34,0,0.10) 40%,transparent 70%);filter:blur(40px);animation:flame 4s ease-in-out infinite alternate;pointer-events:none}
@keyframes flame{0%{transform:translate(-50%,-50%) scale(1)}100%{transform:translate(-52%,-50%) scale(1.08)}}
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:24px;max-width:520px}
.eyebrow{font-size:.7rem;letter-spacing:.45em;text-transform:uppercase;color:rgba(255,255,255,0.5);display:inline-flex;align-items:center;gap:14px}
.eyebrow::before,.eyebrow::after{content:"";width:36px;height:1px;background:#CC2200}
.code{font-family:"Bebas Neue",sans-serif;font-size:clamp(8rem,22vw,16rem);letter-spacing:.04em;line-height:.9;background:linear-gradient(180deg,#FFFFFF 0%,#CC2200 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-family:"Bebas Neue",sans-serif;font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:.06em}
p{font-size:.9rem;line-height:1.7;color:rgba(255,255,255,0.5);max-width:420px}
.btn{height:48px;padding:0 28px;border-radius:2px;font-family:"Bebas Neue",sans-serif;font-size:1rem;letter-spacing:.18em;display:inline-flex;align-items:center;text-decoration:none;background:#CC2200;color:#000;border:1px solid #CC2200;transition:transform .25s ease,box-shadow .25s ease;margin-top:8px}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(204,34,0,0.4)}
</style>
</head>
<body>
  <div class="flame" aria-hidden="true"></div>
  <div class="wrap">
    <span class="eyebrow">Lost in the void</span>
    <div class="code">404</div>
    <h1>Эта страница вышла за&nbsp;пределы заряда</h1>
    <p>Ничего страшного. Вернись на главную и продолжай скроллить детонацию.</p>
    <a class="btn" href="/">Back to BURN</a>
  </div>
</body>
</html>
